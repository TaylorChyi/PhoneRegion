[package]
name = "phone-region"
version = "1.3.2"
edition = "2024"
publish = false
description = "Windows 离线手机号段归属地查询"

[[bin]]
name = "PhoneRegion"
path = "src/main.rs"

[dependencies]
calamine = "0.38"
csv = "1.4"
encoding_rs = "0.8.44"
rust_xlsxwriter = "0.103"
tempfile = "3.27"

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
lto = "thin"
