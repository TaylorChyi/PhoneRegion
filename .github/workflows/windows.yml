name: Windows build and smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: true
            exe: ./target/release/PhoneRegion.exe
            cli: ./target/release/phone-region-cli.exe
          - build: false
            exe: ./download/PhoneRegion.exe
            cli: ./download/phone-region-cli.exe
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check locked dependencies
        if: matrix.build
        run: cargo test --locked --all-targets
      - name: Build Windows application
        if: matrix.build
        run: cargo build --release --locked
      - name: Exercise offline interface in light and dark themes
        env:
          EXE_PATH: ${{ matrix.exe }}
        shell: pwsh
        run: |
          $themeKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          $hadThemeKey = Test-Path -LiteralPath $themeKey
          $originalTheme = if ($hadThemeKey) {
            (Get-ItemProperty -LiteralPath $themeKey -Name AppsUseLightTheme -ErrorAction SilentlyContinue).AppsUseLightTheme
          }
          try {
            New-Item -Path $themeKey -Force | Out-Null
            foreach ($theme in @(1, 0)) {
              Set-ItemProperty -LiteralPath $themeKey -Name AppsUseLightTheme -Value $theme
              ./scripts/windows-smoke.ps1 -ExePath $env:EXE_PATH -BlockNetwork
            }
          }
          finally {
            if ($null -ne $originalTheme) {
              Set-ItemProperty -LiteralPath $themeKey -Name AppsUseLightTheme -Value $originalTheme
            }
            else {
              Remove-ItemProperty -LiteralPath $themeKey -Name AppsUseLightTheme -ErrorAction SilentlyContinue
            }
            if (-not $hadThemeKey) {
              Remove-Item -LiteralPath $themeKey -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Exercise CLI lookup and batch export
        env:
          CLI_PATH: ${{ matrix.cli }}
        shell: pwsh
        run: ./scripts/cli-smoke.ps1 -ExePath $env:CLI_PATH
      - name: Upload tested application
        if: matrix.build
        uses: actions/upload-artifact@v4
        with:
          name: PhoneRegion-Windows-x64
          path: |
            target/release/PhoneRegion.exe
            target/release/phone-region-cli.exe
          if-no-files-found: error
